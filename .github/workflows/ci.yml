name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check current mockup and documentation
        run: node scripts/agent-doctor.mjs

      - name: Set up pnpm after frontend package is added
        if: ${{ hashFiles('package.json') != '' }}
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, types, tests, and build
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
