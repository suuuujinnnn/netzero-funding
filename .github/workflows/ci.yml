name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation, formatting, lint, types, and build
        run: pnpm agent:verify
